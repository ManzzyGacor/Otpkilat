<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>Pesan Nomor — KilatOTP</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script>
(function(){try{var t=localStorage.getItem('kilatotp-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
    .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 11px; }
    .service {
        display: flex; align-items: center; gap: 11px; padding: 13px;
        border-radius: var(--radius-sm); border: 1px solid var(--border);
        background: var(--surface); cursor: pointer; text-align: left; width: 100%;
        font-family: inherit; color: var(--text); font-size: 13px; font-weight: 700;
        transition: border-color var(--transition), transform var(--transition);
    }
    .service:hover { border-color: var(--primary); transform: translateY(-2px); }
    .service img { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; border-radius: 8px; }
    .service span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .country { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
    .country-head {
        display: flex; align-items: center; gap: 12px; padding: 14px;
        cursor: pointer; width: 100%; border: none; background: none;
        font-family: inherit; color: var(--text); text-align: left;
    }
    .country-head:hover { background: var(--surface-2); }
    .country-head img { width: 28px; border-radius: 5px; flex-shrink: 0; }
    .country-head .caret { margin-left: auto; transition: transform var(--transition); color: var(--text-soft); }
    .country.open .caret { transform: rotate(180deg); color: var(--primary); }
    .country-body { display: none; padding: 0 14px 14px; }
    .country.open .country-body { display: block; }

    .price-row {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 11px 13px; border-radius: 10px; background: var(--surface-2);
        border: 1px solid var(--border); margin-top: 9px;
    }

    .order-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 17px; }
    .order-card.has-otp { border-color: var(--success); background: var(--success-soft); }
    .otp-code {
        font-family: ui-monospace, monospace; font-size: 27px; font-weight: 800;
        letter-spacing: 3px; color: var(--success); cursor: pointer;
    }
    .phone { font-family: ui-monospace, monospace; font-size: 19px; font-weight: 800; cursor: pointer; }
    .timer { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header class="topbar">
    <div class="container">
        <a href="/dashboard" class="brand">
            <span class="brand-mark"><i class="ph-fill ph-lightning"></i></span>
            <span data-site-name>KilatOTP</span>
        </a>
        <div class="row" style="gap:8px">
            <a href="/deposit" class="badge badge-success" style="text-decoration:none">
                <i class="ph-fill ph-wallet"></i> <span id="headerBalance">Rp0</span>
            </a>
            <button class="theme-toggle" data-theme-toggle type="button">
                <i class="ph-bold ph-sun icon-light"></i>
                <i class="ph-bold ph-moon icon-dark"></i>
            </button>
        </div>
    </div>
</header>

<main class="container app-shell page-enter">

    <!-- Pesanan aktif -->
    <section id="activeSection" class="hidden" style="margin-bottom:26px">
        <div class="row-between" style="margin-bottom:13px">
            <h3 style="font-size:16px">Pesanan Berjalan</h3>
            <span class="badge badge-warning" id="activeCount">0 aktif</span>
        </div>
        <div id="activeOrders" class="stack"></div>
    </section>

    <!-- Langkah 1: layanan -->
    <section id="stepService">
        <h2 style="margin-bottom:6px">Pesan Nomor</h2>
        <p class="muted small" style="margin-bottom:18px">Pilih aplikasi yang membutuhkan verifikasi, lalu pilih negara.</p>

        <div class="field">
            <input type="search" id="searchService" placeholder="Cari aplikasi, mis. WhatsApp" autocomplete="off">
        </div>

        <div class="row-between" style="margin-bottom:13px">
            <h3 style="font-size:15px">Daftar Aplikasi</h3>
            <span class="badge" id="serviceCount">Memuat...</span>
        </div>

        <div class="service-grid" id="serviceGrid">
            <div class="card center" style="grid-column:1/-1"><span class="spinner spinner-lg"></span></div>
        </div>

        <div class="pagination hidden" id="servicePager">
            <button class="btn btn-secondary btn-sm" id="servicePrev"><i class="ph-bold ph-caret-left"></i> Sebelumnya</button>
            <span class="small muted" id="servicePageInfo">Hal 1 / 1</span>
            <button class="btn btn-secondary btn-sm" id="serviceNext">Selanjutnya <i class="ph-bold ph-caret-right"></i></button>
        </div>
    </section>

    <!-- Langkah 2: negara -->
    <section id="stepCountry" class="hidden">
        <div class="row-between" style="margin-bottom:16px">
            <div class="row">
                <img id="selectedServiceImg" class="avatar avatar-sm" alt="" style="border-radius:9px">
                <div>
                    <h3 style="font-size:17px" id="selectedServiceName">Layanan</h3>
                    <p class="tiny muted">Pilih negara dan harga</p>
                </div>
            </div>
            <button class="btn btn-ghost btn-sm" id="backToServices"><i class="ph-bold ph-arrow-left"></i> Ganti</button>
        </div>

        <div class="field">
            <input type="search" id="searchCountry" placeholder="Cari negara" autocomplete="off">
        </div>

        <div class="stack" id="countryList"></div>

        <div class="pagination hidden" id="countryPager">
            <button class="btn btn-secondary btn-sm" id="countryPrev"><i class="ph-bold ph-caret-left"></i> Sebelumnya</button>
            <span class="small muted" id="countryPageInfo">Hal 1 / 1</span>
            <button class="btn btn-secondary btn-sm" id="countryNext">Selanjutnya <i class="ph-bold ph-caret-right"></i></button>
        </div>
    </section>

</main>

<nav class="bottom-nav">
    <a href="/dashboard"><i class="ph-bold ph-house"></i><span>Home</span></a>
    <a href="/deposit"><i class="ph-bold ph-wallet"></i><span>Top Up</span></a>
    <a href="/order"><i class="ph-fill ph-shopping-bag"></i><span>Order</span></a>
    <a href="/riwayat"><i class="ph-bold ph-clock-counter-clockwise"></i><span>Riwayat</span></a>
    <a href="/profile"><i class="ph-bold ph-user"></i><span>Profil</span></a>
</nav>

<script src="/js/app.js"></script>
<script>
App.ready(function () {
    if (!App.Session.requireLogin()) return;

    var esc = App.escapeHtml;
    var PER_PAGE_SERVICE = 24;
    var PER_PAGE_COUNTRY = 10;

    var services = [], filteredServices = [], servicePage = 1;
    var countries = [], filteredCountries = [], countryPage = 1;
    var currentService = null;
    var pollTimers = {};   // polling OTP per pesanan
    var tickTimer = null;  // hitung mundur kedaluwarsa

    App.siteConfig().then(function (config) {
        if (config.siteName) {
            document.querySelectorAll('[data-site-name]').forEach(function (el) { el.textContent = config.siteName; });
        }
    });

    /* ----------------------------- Saldo ------------------------------- */
    async function loadBalance() {
        try {
            var result = await App.api.get('/api/user/me');
            App.Motion.countUp(document.getElementById('headerBalance'), result.data.balance, App.rupiah);
        } catch (e) { /* diabaikan */ }
    }

    /* -------------------------- Pesanan aktif -------------------------- */
    async function loadActiveOrders() {
        try {
            var result = await App.api.get('/api/otp/active');
            renderActiveOrders(result.data || []);
        } catch (error) { /* diabaikan */ }
    }

    function renderActiveOrders(orders) {
        var section = document.getElementById('activeSection');
        var container = document.getElementById('activeOrders');

        // Hentikan polling untuk pesanan yang sudah tidak aktif
        Object.keys(pollTimers).forEach(function (id) {
            if (!orders.some(function (o) { return o.orderId === id; })) {
                clearInterval(pollTimers[id]);
                delete pollTimers[id];
            }
        });

        if (!orders.length) {
            section.classList.add('hidden');
            container.innerHTML = '';
            return;
        }

        section.classList.remove('hidden');
        document.getElementById('activeCount').textContent = orders.length + ' aktif';

        container.innerHTML = orders.map(function (order) {
            var hasOtp = Boolean(order.otpCode);
            return '<div class="order-card' + (hasOtp ? ' has-otp' : '') + '" id="card-' + esc(order.orderId) + '">' +
                '<div class="row-between" style="margin-bottom:11px">' +
                '<span class="badge ' + (hasOtp ? 'badge-success' : 'badge-warning') + '" id="badge-' + esc(order.orderId) + '">' +
                (hasOtp ? '<i class="ph-fill ph-check-circle"></i> OTP Diterima' : '<span class="dot dot-pulse"></span> Menunggu OTP') +
                '</span>' +
                '<span class="tiny mono soft timer" data-expires="' + (order.expiresInSeconds || 0) + '">-</span>' +
                '</div>' +

                '<div class="row-between" style="gap:14px">' +
                '<div style="min-width:0">' +
                '<div class="tiny muted truncate">' + esc(order.service) + ' &middot; ' + esc(order.country) + '</div>' +
                '<div class="phone copyable" data-copy="' + esc(order.phoneNumber) + '">' + esc(order.phoneNumber) +
                ' <i class="ph ph-copy" style="font-size:13px;opacity:.5"></i></div>' +
                '</div>' +
                '<div id="otp-' + esc(order.orderId) + '" style="text-align:right">' +
                (hasOtp
                    ? '<span class="otp-code copyable" data-copy="' + esc(order.otpCode) + '">' + esc(order.otpCode) + '</span>'
                    : '<span class="spinner"></span>') +
                '</div>' +
                '</div>' +

                '<div class="grid" style="grid-template-columns:1fr 1fr;gap:9px;margin-top:14px">' +
                '<button class="btn btn-success btn-sm" data-done="' + esc(order.orderId) + '">Selesai</button>' +
                '<button class="btn btn-secondary btn-sm" data-cancel="' + esc(order.orderId) + '">Batalkan</button>' +
                '</div>' +
                '<p class="tiny soft" style="margin-top:9px">Saldo dikembalikan penuh bila dibatalkan sebelum OTP masuk.</p>' +
                '</div>';
        }).join('');

        bindOrderActions();
        startTicker();

        // Polling hanya untuk pesanan yang belum menerima OTP
        orders.forEach(function (order) {
            if (!order.otpCode && !pollTimers[order.orderId]) startPolling(order.orderId);
        });
    }

    function bindOrderActions() {
        document.querySelectorAll('[data-copy]').forEach(function (el) {
            el.addEventListener('click', function () { App.copyText(el.getAttribute('data-copy')); });
        });
        document.querySelectorAll('[data-done]').forEach(function (button) {
            button.addEventListener('click', function () { setStatus(button.getAttribute('data-done'), 'done', button); });
        });
        document.querySelectorAll('[data-cancel]').forEach(function (button) {
            button.addEventListener('click', function () {
                if (!confirm('Batalkan pesanan ini? Saldo akan dikembalikan.')) return;
                setStatus(button.getAttribute('data-cancel'), 'cancel', button);
            });
        });
    }

    function startTicker() {
        if (tickTimer) clearInterval(tickTimer);
        var tick = function () {
            document.querySelectorAll('.timer[data-expires]').forEach(function (el) {
                var remaining = Number(el.getAttribute('data-expires'));
                if (remaining <= 0) { el.textContent = 'habis'; return; }
                el.setAttribute('data-expires', remaining - 1);
                var minutes = Math.floor(remaining / 60);
                el.textContent = minutes + ':' + String(remaining % 60).padStart(2, '0');
            });
        };
        tick();
        tickTimer = setInterval(tick, 1000);
    }

    function startPolling(orderId) {
        var attempts = 0;
        var MAX_ATTEMPTS = 220; // sekitar 11 menit, di bawah batas kedaluwarsa server

        pollTimers[orderId] = setInterval(async function () {
            if (document.visibilityState !== 'visible') return;

            // Berhenti sendiri agar tidak memanggil server tanpa henti bila
            // provider terus mengembalikan galat.
            attempts++;
            if (attempts > MAX_ATTEMPTS) {
                clearInterval(pollTimers[orderId]);
                delete pollTimers[orderId];
                return;
            }

            try {
                var result = await App.api.get('/api/otp/check-order?order_id=' + encodeURIComponent(orderId));
                var data = result.data;
                if (!data) return;

                if (data.otp_code && String(data.otp_code).trim()) {
                    clearInterval(pollTimers[orderId]);
                    delete pollTimers[orderId];

                    var code = String(data.otp_code).trim();
                    var box = document.getElementById('otp-' + orderId);
                    if (box) {
                        box.innerHTML = '<span class="otp-code copyable">' + esc(code) + '</span>';
                        box.querySelector('.otp-code').addEventListener('click', function () { App.copyText(code); });
                    }
                    var badge = document.getElementById('badge-' + orderId);
                    if (badge) {
                        badge.className = 'badge badge-success';
                        badge.innerHTML = '<i class="ph-fill ph-check-circle"></i> OTP Diterima';
                    }
                    var card = document.getElementById('card-' + orderId);
                    if (card) card.classList.add('has-otp');

                    App.toast('Kode OTP diterima: ' + code, 'success', 6000);
                    return;
                }

                if (['canceled', 'expired', 'refunded'].indexOf(data.status) !== -1) {
                    clearInterval(pollTimers[orderId]);
                    delete pollTimers[orderId];
                    App.toast('Pesanan dibatalkan oleh server. Saldo dikembalikan.', 'warning');
                    loadActiveOrders();
                    loadBalance();
                }
            } catch (error) {
                // Pesanan sudah tidak ada: hentikan polling agar tidak terus gagal.
                if (error.status === 404) {
                    clearInterval(pollTimers[orderId]);
                    delete pollTimers[orderId];
                    loadActiveOrders();
                }
            }
        }, 3000);
    }

    async function setStatus(orderId, status, button) {
        var restore = App.loadingButton(button, 'Memproses...');
        try {
            var result = await App.api.get('/api/otp/set-status?order_id=' + encodeURIComponent(orderId) + '&status=' + status);
            App.toast(result.message || 'Berhasil.', 'success');
            if (pollTimers[orderId]) { clearInterval(pollTimers[orderId]); delete pollTimers[orderId]; }
            loadActiveOrders();
            loadBalance();
        } catch (error) {
            App.toast(error.message, 'error');
            restore();
        }
    }

    /* ---------------------------- Layanan ------------------------------ */
    async function loadServices() {
        var grid = document.getElementById('serviceGrid');
        try {
            var result = await App.api.get('/api/otp/services');
            services = result.data || [];
            filteredServices = services;
            document.getElementById('serviceCount').textContent = services.length + ' aplikasi';
            renderServices();
        } catch (error) {
            grid.innerHTML = '<div class="card empty-state" style="grid-column:1/-1">' +
                '<i class="ph ph-warning-circle"></i><p class="small">' + esc(error.message) + '</p></div>';
            document.getElementById('serviceCount').textContent = 'gagal dimuat';
        }
    }

    function renderServices() {
        var grid = document.getElementById('serviceGrid');
        var pager = document.getElementById('servicePager');

        if (!filteredServices.length) {
            grid.innerHTML = '<div class="card empty-state" style="grid-column:1/-1">' +
                '<i class="ph ph-magnifying-glass"></i><p class="small">Aplikasi tidak ditemukan.</p></div>';
            pager.classList.add('hidden');
            return;
        }

        var start = (servicePage - 1) * PER_PAGE_SERVICE;
        grid.innerHTML = filteredServices.slice(start, start + PER_PAGE_SERVICE).map(function (service) {
            return '<button type="button" class="service" data-code="' + esc(service.service_code) + '">' +
                '<img src="' + esc(service.service_img) + '" alt="" loading="lazy">' +
                '<span>' + esc(service.service_name) + '</span>' +
                '</button>';
        }).join('');

        // Data layanan berasal dari API luar, jadi disimpan lewat dataset, bukan
        // disisipkan ke dalam atribut onclick.
        grid.querySelectorAll('.service').forEach(function (button) {
            button.addEventListener('click', function () {
                var code = button.getAttribute('data-code');
                var service = filteredServices.filter(function (s) { return String(s.service_code) === code; })[0];
                if (service) selectService(service);
            });
        });

        var totalPages = Math.ceil(filteredServices.length / PER_PAGE_SERVICE);
        pager.classList.toggle('hidden', totalPages <= 1);
        document.getElementById('servicePageInfo').textContent = 'Hal ' + servicePage + ' / ' + totalPages;
        document.getElementById('servicePrev').disabled = servicePage === 1;
        document.getElementById('serviceNext').disabled = servicePage === totalPages;
    }

    document.getElementById('searchService').addEventListener('input', App.debounce(function (event) {
        var keyword = event.target.value.toLowerCase();
        filteredServices = services.filter(function (s) {
            return String(s.service_name).toLowerCase().indexOf(keyword) !== -1;
        });
        servicePage = 1;
        renderServices();
    }, 250));

    document.getElementById('servicePrev').addEventListener('click', function () {
        if (servicePage > 1) { servicePage--; renderServices(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    document.getElementById('serviceNext').addEventListener('click', function () {
        if (servicePage < Math.ceil(filteredServices.length / PER_PAGE_SERVICE)) {
            servicePage++; renderServices(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });

    /* ----------------------------- Negara ------------------------------ */
    function selectService(service) {
        currentService = service;
        document.getElementById('stepService').classList.add('hidden');
        document.getElementById('stepCountry').classList.remove('hidden');
        document.getElementById('selectedServiceName').textContent = service.service_name;
        document.getElementById('selectedServiceImg').src = service.service_img;
        document.getElementById('searchCountry').value = '';
        loadCountries(service.service_code);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('backToServices').addEventListener('click', function () {
        document.getElementById('stepCountry').classList.add('hidden');
        document.getElementById('stepService').classList.remove('hidden');
    });

    async function loadCountries(serviceCode) {
        var container = document.getElementById('countryList');
        container.innerHTML = '<div class="card center"><span class="spinner spinner-lg"></span></div>';
        document.getElementById('countryPager').classList.add('hidden');

        try {
            var result = await App.api.get('/api/otp/countries?service_id=' + encodeURIComponent(serviceCode));
            countries = result.data || [];
            filteredCountries = countries;
            countryPage = 1;
            renderCountries();
        } catch (error) {
            container.innerHTML = '<div class="card empty-state"><i class="ph ph-warning-circle"></i>' +
                '<p class="small">' + esc(error.message) + '</p></div>';
        }
    }

    function renderCountries() {
        var container = document.getElementById('countryList');
        var pager = document.getElementById('countryPager');

        if (!filteredCountries.length) {
            container.innerHTML = '<div class="card empty-state"><i class="ph ph-globe"></i>' +
                '<p class="small">Negara tidak ditemukan.</p></div>';
            pager.classList.add('hidden');
            return;
        }

        var start = (countryPage - 1) * PER_PAGE_COUNTRY;
        var pageItems = filteredCountries.slice(start, start + PER_PAGE_COUNTRY);

        container.innerHTML = pageItems.map(function (country, index) {
            var prices = (country.pricelist || []).map(function (price) {
                var outOfStock = Number(price.stock) <= 0;
                return '<div class="price-row">' +
                    '<div class="small">Stok <strong>' + esc(price.stock) + '</strong> &middot; ' +
                    '<strong style="color:var(--success)">' + esc(price.price_format) + '</strong></div>' +
                    '<button class="btn btn-sm" ' + (outOfStock ? 'disabled' : '') +
                    ' data-order="' + index + '" data-provider="' + esc(price.provider_id) + '"' +
                    ' data-operator="' + esc(price.operator_id || 1) + '">' +
                    (outOfStock ? 'Kosong' : 'Pesan') + '</button>' +
                    '</div>';
            }).join('');

            return '<div class="country" data-index="' + index + '">' +
                '<button type="button" class="country-head">' +
                '<img src="' + esc(country.img) + '" alt="" loading="lazy">' +
                '<span><span style="display:block;font-weight:800">' + esc(country.name) + '</span>' +
                '<span class="tiny soft">Prefix ' + esc(country.prefix) + ' &middot; ' +
                ((country.pricelist || []).length) + ' penyedia</span></span>' +
                '<i class="ph-bold ph-caret-down caret"></i>' +
                '</button>' +
                '<div class="country-body">' + (prices || '<p class="small soft">Stok kosong.</p>') + '</div>' +
                '</div>';
        }).join('');

        container.querySelectorAll('.country-head').forEach(function (head) {
            head.addEventListener('click', function () { head.parentElement.classList.toggle('open'); });
        });

        container.querySelectorAll('[data-order]').forEach(function (button) {
            button.addEventListener('click', function (event) {
                event.stopPropagation();
                var country = pageItems[Number(button.getAttribute('data-order'))];
                orderNumber(
                    country.number_id || 0,
                    button.getAttribute('data-provider'),
                    button.getAttribute('data-operator'),
                    button
                );
            });
        });

        var totalPages = Math.ceil(filteredCountries.length / PER_PAGE_COUNTRY);
        pager.classList.toggle('hidden', totalPages <= 1);
        document.getElementById('countryPageInfo').textContent = 'Hal ' + countryPage + ' / ' + totalPages;
        document.getElementById('countryPrev').disabled = countryPage === 1;
        document.getElementById('countryNext').disabled = countryPage === totalPages;
    }

    document.getElementById('searchCountry').addEventListener('input', App.debounce(function (event) {
        var keyword = event.target.value.toLowerCase();
        filteredCountries = countries.filter(function (c) {
            return String(c.name).toLowerCase().indexOf(keyword) !== -1 || String(c.prefix).indexOf(keyword) !== -1;
        });
        countryPage = 1;
        renderCountries();
    }, 250));

    document.getElementById('countryPrev').addEventListener('click', function () {
        if (countryPage > 1) { countryPage--; renderCountries(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    document.getElementById('countryNext').addEventListener('click', function () {
        if (countryPage < Math.ceil(filteredCountries.length / PER_PAGE_COUNTRY)) {
            countryPage++; renderCountries(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });

    /* ---------------------------- Pemesanan ---------------------------- */
    async function orderNumber(numberId, providerId, operatorId, button) {
        var restore = App.loadingButton(button, 'Memesan...');
        try {
            await App.api.get('/api/otp/order?number_id=' + encodeURIComponent(numberId) +
                '&provider_id=' + encodeURIComponent(providerId) +
                '&operator_id=' + encodeURIComponent(operatorId || 1));

            App.toast('Nomor berhasil dipesan.', 'success');
            document.getElementById('stepCountry').classList.add('hidden');
            document.getElementById('stepService').classList.remove('hidden');
            await loadActiveOrders();
            loadBalance();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (error) {
            App.toast(error.message, 'error');
        } finally {
            restore();
        }
    }

    loadBalance();
    loadServices();
    loadActiveOrders();

    // Samakan tampilan dengan keadaan server secara berkala, misalnya saat
    // pesanan kedaluwarsa dan saldo dikembalikan otomatis.
    setInterval(function () {
        if (document.visibilityState === 'visible') loadActiveOrders();
    }, 30000);
});
</script>
</body>
</html>
