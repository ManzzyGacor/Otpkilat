<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KilatOTP - Order Nokos</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        .search-box {
            margin-bottom: 15px;
        }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .service-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .service-card:active {
            transform: scale(0.97);
        }
        .service-card img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            flex-shrink: 0;
        }
        /* Style baru untuk kartu negara & harga yang lebih rapi */
        .country-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(12px);
        }
        .pricelist-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--glass-border);
        }
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .number-display-box {
            background: linear-gradient(135deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.1) 100%);
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .phone-number {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 10px 0;
            cursor: pointer;
        }
        .otp-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .otp-code {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #34c759;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-bottom: 20px;">Pesan Nomor Virtual</h2>

        <!-- Step 1: Pilih Layanan dengan Search & Pagination -->
        <div id="stepServiceContainer">
            <div class="search-box">
                <input type="text" id="searchApp" placeholder="Cari nama aplikasi..." onkeyup="filterServices()">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 16px; opacity: 0.8;">Pilih Aplikasi</h3>
                <span id="totalAppCount" style="font-size: 12px; opacity: 0.6;">Memuat...</span>
            </div>
            
            <div class="service-grid" id="serviceGrid">
                <p style="opacity: 0.6; font-size: 14px;">Memuat daftar layanan...</p>
            </div>

            <!-- Tombol Navigasi Pagination Aplikasi -->
            <div class="pagination-container" id="paginationControls" style="display: none;">
                <button class="btn" style="width: auto; padding: 8px 16px; font-size: 13px;" id="prevBtn" onclick="changePage(-1)">Sebelumnya</button>
                <span id="pageInfo" style="font-size: 13px; font-weight: 600;">Hal 1 dari 1</span>
                <button class="btn" style="width: auto; padding: 8px 16px; font-size: 13px;" id="nextBtn" onclick="changePage(1)">Selanjutnya</button>
            </div>
        </div>

        <!-- Step 2: Pilih Negara & Pricelist Harga (Dengan Pagination) -->
        <div id="stepCountryContainer" style="display: none; margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 id="selectedAppTitle" style="font-size: 16px; opacity: 0.8;">Pilih Negara</h3>
                <button onclick="backToServices()" style="background: none; border: none; color: var(--active-color); cursor: pointer; font-weight: 600;">Ganti Layanan</button>
            </div>
            
            <!-- Kolom Search Negara -->
            <div class="search-box" style="margin-bottom: 15px;">
                <input type="text" id="searchCountry" placeholder="Cari nama negara..." onkeyup="filterCountries()">
            </div>

            <div id="countryList" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Render negara & pilihan harga pricelist -->
            </div>

            <!-- Tombol Navigasi Pagination Negara -->
            <div class="pagination-container" id="countryPaginationControls" style="display: none;">
                <button class="btn" style="width: auto; padding: 8px 16px; font-size: 13px;" id="countryPrevBtn" onclick="changeCountryPage(-1)">Sebelumnya</button>
                <span id="countryPageInfo" style="font-size: 13px; font-weight: 600;">Hal 1 dari 1</span>
                <button class="btn" style="width: auto; padding: 8px 16px; font-size: 13px;" id="countryNextBtn" onclick="changeCountryPage(1)">Selanjutnya</button>
            </div>
        </div>

        <!-- Step 3: Kotak Hasil Order & Menunggu OTP -->
        <div id="activeOrderContainer" style="display: none;">
            <div class="liquid-glass" style="padding: 20px;">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px;">
                    <img id="activeServiceImg" src="" alt="App" width="30" height="30">
                    <div>
                        <h4 id="activeServiceName">Layanan</h4>
                        <p style="font-size: 12px; opacity: 0.7;" id="activeCountryName">Negara</p>
                    </div>
                </div>

                <div class="number-display-box">
                    <span style="font-size: 13px; opacity: 0.7;">Nomor Telepon (Klik untuk salin)</span>
                    <div class="phone-number" id="displayPhoneNumber" onclick="copyPhoneNumber()">+62 8xx xxxx</div>
                    <small style="opacity: 0.5;">ID Order: <span id="displayOrderId">-</span></small>
                </div>

                <!-- Kolom Menunggu OTP -->
                <div class="otp-box">
                    <p style="font-weight: 600; margin-bottom: 5px;" id="otpStatusTitle">⏳ Menunggu Kode OTP...</p>
                    <div class="otp-code" id="displayOtpCode">------</div>
                    <p style="font-size: 13px; opacity: 0.7; margin-top: 10px;" id="displayOtpMsg">Pesan SMS belum diterima.</p>
                </div>

                <!-- Tombol Aksi (Konfirmasi / Batal dengan jeda 2 menit) -->
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn" style="background-color: #34c759;" onclick="setOrderStatus('done')">Konfirmasi (Selesai)</button>
                    <button class="btn" style="background-color: #ff3b30;" id="btnCancelOrder" onclick="setOrderStatus('cancel')">Batalkan / Refund</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Bottom Navbar -->
    <nav class="floating-nav liquid-glass">
        <a href="/" class="nav-item">
            <i class="ph ph-house"></i><span>Home</span>
        </a>
        <a href="/deposit" class="nav-item">
            <i class="ph ph-wallet"></i><span>Deposit</span>
        </a>
        <a href="/order" class="nav-item active" style="background: var(--active-color); color: var(--active-text); border-radius: 50%; padding: 12px;">
            <i class="ph ph-shopping-bag" style="font-size: 22px;"></i>
        </a>
        <a href="/riwayat" class="nav-item">
            <i class="ph ph-clock-counter-clockwise"></i><span>Riwayat</span>
        </a>
        <a href="/profile" class="nav-item">
            <i class="ph ph-user"></i><span>Profile</span>
        </a>
    </nav>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        const token = localStorage.getItem('token');
        if(!token) window.location.href = '/login';
        const headers = { 'Authorization': `Bearer ${token}` };

        let allServices = [];
        let filteredServices = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        let allCountries = [];
        let filteredCountries = [];
        let currentCountryPage = 1;
        const countriesPerPage = 10; // Batasi 10 negara per halaman agar ringan

        let selectedServiceName = '';
        let selectedServiceImg = '';
        let activeOrderId = null;
        let otpInterval = null;

        // 1. Ambil Daftar Layanan
        async function loadServices() {
            try {
                const res = await fetch('/api/otp/services', { headers });
                const json = await res.json();
                if(json.success) {
                    allServices = json.data;
                    filteredServices = allServices;
                    document.getElementById('totalAppCount').innerText = `${allServices.length} Aplikasi`;
                    renderPage();
                }
            } catch (err) {
                Toastify({ text: "Gagal memuat layanan", style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
            }
        }

        function renderPage() {
            const grid = document.getElementById('serviceGrid');
            grid.innerHTML = '';

            if(filteredServices.length === 0) {
                grid.innerHTML = `<p style="opacity: 0.6; font-size: 14px; grid-column: span 2; text-align: center;">Aplikasi tidak ditemukan.</p>`;
                document.getElementById('paginationControls').style.display = 'none';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filteredServices.slice(startIndex, endIndex);

            paginatedItems.forEach(s => {
                grid.innerHTML += `
                    <div class="service-card" onclick="selectService(${s.service_code}, '${s.service_name}', '${s.service_img}')">
                        <img src="${s.service_img}" alt="${s.service_name}">
                        <div style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${s.service_name}</div>
                    </div>
                `;
            });

            const totalPages = Math.ceil(filteredServices.length / itemsPerPage);
            if(totalPages > 1) {
                document.getElementById('paginationControls').style.display = 'flex';
                document.getElementById('pageInfo').innerText = `Hal ${currentPage} dari ${totalPages}`;
                document.getElementById('prevBtndisabled').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage === totalPages;
            } else {
                document.getElementById('paginationControls').style.display = 'none';
            }
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredServices.length / itemsPerPage);
            currentPage += direction;
            if(currentPage < 1) currentPage = 1;
            if(currentPage > totalPages) currentPage = totalPages;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterServices() {
            const keyword = document.getElementById('searchApp').value.toLowerCase();
            filteredServices = allServices.filter(s => s.service_name.toLowerCase().includes(keyword));
            currentPage = 1;
            renderPage();
        }

        async function selectService(code, name, img) {
            selectedServiceName = name;
            selectedServiceImg = img;

            document.getElementById('stepServiceContainer').style.display = 'none';
            document.getElementById('stepCountryContainer').style.display = 'block';
            document.getElementById('selectedAppTitle').innerText = `Pilih Negara - ${name}`;
            document.getElementById('searchCountry').value = '';
            
            loadCountries(code);
        }

        function backToServices() {
            document.getElementById('stepCountryContainer').style.display = 'none';
            document.getElementById('stepServiceContainer').style.display = 'block';
        }

        // 2. Ambil Daftar Negara & Pricelist dengan Sistem Pagination & Tampilan Baru
        async function loadCountries(serviceId) {
            try {
                const container = document.getElementById('countryList');
                container.innerHTML = `<p style="opacity: 0.6; font-size: 14px; text-align: center;">Memuat daftar negara & harga...</p>`;
                document.getElementById('countryPaginationControls').style.display = 'none';

                const res = await fetch(`/api/otp/countries?service_id=${serviceId}`, { headers });
                const json = await res.json();

                if(json.success) {
                    allCountries = json.data;
                    filteredCountries = allCountries;
                    currentCountryPage = 1;
                    renderCountryPage();
                }
            } catch (err) {
                Toastify({ text: "Gagal memuat negara", style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
            }
        }

        function renderCountryPage() {
            const container = document.getElementById('countryList');
            container.innerHTML = '';

            if(filteredCountries.length === 0) {
                container.innerHTML = `<p style="opacity: 0.6; font-size: 14px; text-align: center;">Negara tidak ditemukan.</p>`;
                document.getElementById('countryPaginationControls').style.display = 'none';
                return;
            }

            const startIndex = (currentCountryPage - 1) * countriesPerPage;
            const endIndex = startIndex + countriesPerPage;
            const paginatedCountries = filteredCountries.slice(startIndex, endIndex);

            paginatedCountries.forEach(c => {
                let pricelistHtml = '';
                if(c.pricelist && c.pricelist.length > 0) {
                    c.pricelist.forEach(p => {
                        pricelistHtml += `
                            <div class="pricelist-row">
                                <div style="font-size: 13px;">
                                    Stok: <span style="font-weight: 600; color: var(--text-color);">${p.stock}</span> | 
                                    Harga: <b style="color: #34c759; font-size: 14px;">${p.price_format}</b>
                                </div>
                                <button class="btn" style="width: auto; padding: 6px 16px; font-size: 13px; background: var(--active-color); color: var(--active-text);" onclick="orderNumber(${p.number_id || 0}, ${p.provider_id}, 1)">Pesan</button>
                            </div>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="country-card">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="${c.img}" alt="${c.name}" width="30" style="border-radius: 6px; border: 1px solid var(--glass-border);">
                            <div>
                                <div style="font-weight: 700; font-size: 15px;">${c.name}</div>
                                <div style="font-size: 12px; opacity: 0.6;">Kode Prefix: ${c.prefix}</div>
                            </div>
                        </div>
                        ${pricelistHtml}
                    </div>
                `;
            });

            // Atur Pagination Negara
            const totalPages = Math.ceil(filteredCountries.length / countriesPerPage);
            if(totalPages > 1) {
                document.getElementById('countryPaginationControls').style.display = 'flex';
                document.getElementById('countryPageInfo').innerText = `Hal ${currentCountryPage} dari ${totalPages}`;
                document.getElementById('countryPrevBtn').disabled = currentCountryPage === 1;
                document.getElementById('countryNextBtn').disabled = currentCountryPage === totalPages;
            } else {
                document.getElementById('countryPaginationControls').style.display = 'none';
            }
        }

        function changeCountryPage(direction) {
            const totalPages = Math.ceil(filteredCountries.length / countriesPerPage);
            currentCountryPage += direction;
            if(currentCountryPage < 1) currentCountryPage = 1;
            if(currentCountryPage > totalPages) currentCountryPage = totalPages;
            renderCountryPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCountries() {
            const keyword = document.getElementById('searchCountry').value.toLowerCase();
            filteredCountries = allCountries.filter(c => c.name.toLowerCase().includes(keyword) || c.prefix.includes(keyword));
            currentCountryPage = 1;
            renderCountryPage();
        }

        // 3. Eksekusi Pemesanan Nomor
        async function orderNumber(numberId, providerId, operatorId) {
            try {
                Toastify({ text: "Memesan nomor...", style: { background: "#007AFF", borderRadius: "14px" } }).showToast();
                const res = await fetch(`/api/otp/order?number_id=${numberId}&provider_id=${providerId}&operator_id=${operatorId}`, { headers });
                const json = await res.json();

                if(json.success) {
                    const data = json.data;
                    activeOrderId = data.order_id;

                    document.getElementById('stepCountryContainer').style.display = 'none';
                    document.getElementById('activeOrderContainer').style.display = 'block';

                    document.getElementById('activeServiceImg').src = selectedServiceImg;
                    document.getElementById('activeServiceName').innerText = selectedServiceName;
                    document.getElementById('activeCountryName').innerText = data.country;
                    document.getElementById('displayPhoneNumber').innerText = data.phone_number;
                    document.getElementById('displayOrderId').innerText = data.order_id;

                    Toastify({ text: "Nomor berhasil didapatkan!", style: { background: "#34c759", borderRadius: "14px" } }).showToast();

                    startPollingOtp(data.order_id);
                } else {
                    Toastify({ text: json.message || "Gagal memesan nomor", style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
                }
            } catch (err) {
                Toastify({ text: "Terjadi kesalahan server", style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
            }
        }

        function copyPhoneNumber() {
            const num = document.getElementById('displayPhoneNumber').innerText;
            navigator.clipboard.writeText(num);
            Toastify({ text: "Nomor disalin ke clipboard!", style: { background: "#000", color: "#fff", borderRadius: "14px" } }).showToast();
        }

        function startPollingOtp(orderId) {
            if(otpInterval) clearInterval(otpInterval);

            otpInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/otp/check-order?order_id=${orderId}`, { headers });
                    const json = await res.json();
                    if(json.success && json.data) {
                        const d = json.data;
                        if(d.otp_code) {
                            document.getElementById('otpStatusTitle').innerText = "✅ Kode OTP Diterima!";
                            document.getElementById('displayOtpCode').innerText = d.otp_code;
                            document.getElementById('displayOtpMsg').innerText = d.otp_msg || '';
                            clearInterval(otpInterval);
                        }
                    }
                } catch (err) {
                    console.error("Gagal memeriksa status OTP");
                }
            }, 5000);
        }

        async function setOrderStatus(status) {
            if(!activeOrderId) return;
            try {
                const res = await fetch(`/api/otp/set-status?order_id=${activeOrderId}&status=${status}`, { headers });
                const json = await res.json();

                if(json.success) {
                    Toastify({ text: `Status berhasil diubah ke: ${status}`, style: { background: "#34c759", borderRadius: "14px" } }).showToast();
                    if(status === 'cancel' || status === 'done') {
                        if(otpInterval) clearInterval(otpInterval);
                        setTimeout(() => window.location.href = '/', 2000);
                    }
                } else {
                    Toastify({ text: json.message, style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
                }
            } catch (err) {
                Toastify({ text: "Gagal memproses permintaan", style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
            }
        }

        loadServices();
    </script>
</body>
</html>
