<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>Daftar — KilatOTP</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script>
(function(){try{var t=localStorage.getItem('kilatotp-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 18px; }
    .auth-card { width: 100%; max-width: 460px; }
    .auth-head { text-align: center; margin-bottom: 26px; }
    .auth-head .brand { justify-content: center; margin-bottom: 18px; }
    .auth-head h1 { font-size: 26px; margin-bottom: 6px; }
    .auth-head p { color: var(--text-muted); font-size: 14px; }
    .auth-top { position: absolute; top: 18px; right: 18px; }
    .pw-wrap { position: relative; }
    .pw-toggle {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        width: 34px; height: 34px; border: none; background: none; cursor: pointer;
        color: var(--text-soft); display: grid; place-items: center; font-size: 18px; border-radius: 8px;
    }
    .pw-toggle:hover { color: var(--text); background: var(--surface-2); }
    .pw-wrap input { padding-right: 44px; }
    .alert {
        display: none; gap: 9px; align-items: flex-start;
        padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 18px;
        background: var(--danger-soft); color: var(--danger); font-size: 13px; font-weight: 600;
    }
    .alert.show { display: flex; }
    .strength { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-top: 7px; }
    .strength span { display: block; height: 100%; width: 0; background: var(--danger); transition: width 200ms ease, background-color 200ms ease; }
    .form-2col { display: grid; gap: 0 14px; grid-template-columns: 1fr; }
    @media (min-width: 520px) { .form-2col { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div class="auth-top">
    <button class="theme-toggle" data-theme-toggle type="button">
        <i class="ph-bold ph-sun icon-light"></i>
        <i class="ph-bold ph-moon icon-dark"></i>
    </button>
</div>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <a href="/" class="brand">
                <span class="brand-mark"><i class="ph-fill ph-lightning"></i></span>
                <span data-site-name>KilatOTP</span>
            </a>
            <h1>Buat akun gratis</h1>
            <p>Tidak ada biaya pendaftaran. Isi saldo hanya saat dibutuhkan.</p>
        </div>

        <div class="card">
            <div class="alert" id="alertBox"><i class="ph-fill ph-warning-circle"></i><span id="alertText"></span></div>

            <form id="registerForm" novalidate>
                <div class="field">
                    <label for="fullName">Nama Lengkap</label>
                    <input type="text" id="fullName" autocomplete="name" placeholder="Nama Anda" required>
                </div>

                <div class="form-2col">
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" autocomplete="username" placeholder="budi123" required>
                        <span class="field-hint">3-20 huruf, angka, atau _</span>
                    </div>
                    <div class="field">
                        <label for="phoneNumber">Nomor HP <span class="soft">(opsional)</span></label>
                        <input type="tel" id="phoneNumber" autocomplete="tel" placeholder="0812xxxxxxxx">
                    </div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" placeholder="budi@email.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="password" autocomplete="new-password" placeholder="Minimal 6 karakter" required>
                        <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Tampilkan password">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                    <div class="strength"><span id="strengthBar"></span></div>
                    <span class="field-hint" id="strengthText">Gunakan kombinasi huruf dan angka.</span>
                </div>

                <button type="submit" class="btn btn-block" id="submitBtn">Daftar Sekarang</button>
            </form>

            <div id="googleSection" class="hidden">
                <div class="divider-text">atau</div>
                <a href="/api/auth/google" class="btn btn-google btn-block">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Daftar dengan Google
                </a>
            </div>

            <p class="center small muted" style="margin-top:20px">
                Sudah punya akun? <a href="/login" style="font-weight:700">Masuk di sini</a>
            </p>
        </div>

        <p class="center small muted" style="margin-top:20px">
            <a href="/" class="muted"><i class="ph ph-arrow-left"></i> Kembali ke beranda</a>
        </p>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
App.ready(function () {
    if (App.Session.token()) location.replace('/dashboard');

    function showAlert(message) {
        document.getElementById('alertText').textContent = message;
        document.getElementById('alertBox').classList.add('show');
    }

    App.siteConfig().then(function (config) {
        if (config.googleEnabled) document.getElementById('googleSection').classList.remove('hidden');
        if (config.siteName) {
            document.querySelectorAll('[data-site-name]').forEach(function (el) { el.textContent = config.siteName; });
        }
    });

    document.querySelectorAll('[data-toggle-password]').forEach(function (button) {
        button.addEventListener('click', function () {
            var input = document.getElementById(button.getAttribute('data-toggle-password'));
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            button.innerHTML = show ? '<i class="ph ph-eye-slash"></i>' : '<i class="ph ph-eye"></i>';
        });
    });

    // Indikator kekuatan password
    var bar = document.getElementById('strengthBar');
    var hint = document.getElementById('strengthText');
    document.getElementById('password').addEventListener('input', function (event) {
        var value = event.target.value;
        var score = 0;
        if (value.length >= 6) score++;
        if (value.length >= 10) score++;
        if (/[0-9]/.test(value) && /[a-zA-Z]/.test(value)) score++;
        if (/[^a-zA-Z0-9]/.test(value)) score++;

        var levels = [
            { w: '0%', c: 'var(--danger)', t: 'Gunakan kombinasi huruf dan angka.' },
            { w: '30%', c: 'var(--danger)', t: 'Password masih lemah.' },
            { w: '55%', c: 'var(--warning)', t: 'Lumayan, tambahkan angka atau simbol.' },
            { w: '80%', c: 'var(--success)', t: 'Password sudah kuat.' },
            { w: '100%', c: 'var(--success)', t: 'Password sangat kuat.' }
        ];
        var level = levels[score];
        bar.style.width = level.w;
        bar.style.background = level.c;
        hint.textContent = level.t;
    });

    document.getElementById('registerForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        document.getElementById('alertBox').classList.remove('show');

        var payload = {
            fullName: document.getElementById('fullName').value.trim(),
            username: document.getElementById('username').value.trim().toLowerCase(),
            email: document.getElementById('email').value.trim().toLowerCase(),
            phoneNumber: document.getElementById('phoneNumber').value.trim(),
            password: document.getElementById('password').value
        };

        // Validasi di sisi klien agar kesalahan umum langsung terlihat
        if (payload.fullName.length < 2) return showAlert('Nama lengkap minimal 2 karakter.');
        if (!/^[a-z0-9_]{3,20}$/.test(payload.username)) return showAlert('Username 3-20 karakter, hanya huruf, angka, dan garis bawah.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) return showAlert('Format email tidak valid.');
        if (payload.password.length < 6) return showAlert('Password minimal 6 karakter.');

        var restore = App.loadingButton(document.getElementById('submitBtn'), 'Mendaftar...');
        try {
            await App.api.post('/api/auth/register', payload);
            App.toast('Registrasi berhasil. Silakan masuk.', 'success');
            setTimeout(function () { location.href = '/login'; }, 900);
        } catch (error) {
            showAlert(error.message);
            restore();
        }
    });
});
</script>
</body>
</html>
