<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>Halaman Tidak Ditemukan — KilatOTP</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script>
(function(){try{var t=localStorage.getItem('kilatotp-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px">
    <div class="center" style="max-width:420px">
        <div style="font-size:70px;font-weight:800;color:var(--primary);letter-spacing:-4px">404</div>
        <h2 style="margin:10px 0 10px">Halaman tidak ditemukan</h2>
        <p class="muted small" style="margin-bottom:24px">
            Alamat yang Anda buka tidak tersedia atau sudah dipindahkan.
        </p>
        <div class="row" style="justify-content:center">
            <a href="/" class="btn">Kembali ke Beranda</a>
            <a href="/dashboard" class="btn btn-secondary">Buka Dashboard</a>
        </div>
    </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
