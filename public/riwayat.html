<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>Riwayat — KilatOTP</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script>
(function(){try{var t=localStorage.getItem('kilatotp-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
    .history-item {
        display: flex; gap: 13px; align-items: flex-start;
        padding: 15px; border: 1px solid var(--border);
        border-radius: var(--radius-sm); background: var(--surface);
    }
    .history-icon {
        width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
        display: grid; place-items: center; font-size: 19px;
        background: var(--surface-2); color: var(--text-muted); overflow: hidden;
    }
    .history-icon img { width: 100%; height: 100%; object-fit: contain; }
    .otp-pill {
        font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: 1px;
        padding: 3px 9px; border-radius: 7px; background: var(--success-soft); color: var(--success);
        cursor: pointer; font-size: 13px;
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="container">
        <a href="/dashboard" class="brand">
            <span class="brand-mark"><i class="ph-fill ph-lightning"></i></span>
            <span data-site-name>KilatOTP</span>
        </a>
        <button class="theme-toggle" data-theme-toggle type="button">
            <i class="ph-bold ph-sun icon-light"></i>
            <i class="ph-bold ph-moon icon-dark"></i>
        </button>
    </div>
</header>

<main class="container container-narrow app-shell">

    <h2 style="margin-bottom:6px">Riwayat Transaksi</h2>
    <p class="muted small" style="margin-bottom:20px">Semua pesanan nomor dan top up saldo Anda.</p>

    <div class="tabs">
        <button class="tab active" data-tab="orders">Pesanan Nomor</button>
        <button class="tab" data-tab="deposits">Top Up Saldo</button>
    </div>

    <div class="row-between" style="margin-bottom:14px">
        <select id="statusFilter" style="max-width:200px">
            <option value="">Semua status</option>
            <option value="completed">Selesai</option>
            <option value="received">Berjalan</option>
            <option value="canceled">Dibatalkan</option>
            <option value="expiring">Kedaluwarsa</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="refreshBtn"><i class="ph-bold ph-arrows-clockwise"></i> Segarkan</button>
    </div>

    <div id="listContainer" class="stack">
        <div class="card center"><span class="spinner spinner-lg"></span></div>
    </div>

    <div class="pagination hidden" id="pager">
        <button class="btn btn-secondary btn-sm" id="prevBtn"><i class="ph-bold ph-caret-left"></i> Sebelumnya</button>
        <span class="small muted" id="pageInfo">Hal 1 / 1</span>
        <button class="btn btn-secondary btn-sm" id="nextBtn">Selanjutnya <i class="ph-bold ph-caret-right"></i></button>
    </div>

</main>

<nav class="bottom-nav">
    <a href="/dashboard"><i class="ph-bold ph-house"></i><span>Home</span></a>
    <a href="/deposit"><i class="ph-bold ph-wallet"></i><span>Top Up</span></a>
    <a href="/order"><i class="ph-bold ph-shopping-bag"></i><span>Order</span></a>
    <a href="/riwayat"><i class="ph-fill ph-clock-counter-clockwise"></i><span>Riwayat</span></a>
    <a href="/profile"><i class="ph-bold ph-user"></i><span>Profil</span></a>
</nav>

<script src="/js/app.js"></script>
<script>
App.ready(function () {
    if (!App.Session.requireLogin()) return;

    var esc = App.escapeHtml;
    var activeTab = 'orders';
    var page = 1;

    App.siteConfig().then(function (config) {
        if (config.siteName) {
            document.querySelectorAll('[data-site-name]').forEach(function (el) { el.textContent = config.siteName; });
        }
    });

    var ORDER_STATUS = {
        completed: ['badge-success', 'Selesai'],
        received: ['badge-warning', 'Berjalan'],
        pending: ['badge-warning', 'Berjalan'],
        canceled: ['badge', 'Dibatalkan'],
        expiring: ['badge', 'Kedaluwarsa']
    };
    var DEPOSIT_STATUS = {
        success: ['badge-success', 'Berhasil'],
        pending: ['badge-warning', 'Menunggu'],
        canceled: ['badge', 'Dibatalkan'],
        rejected: ['badge-danger', 'Ditolak'],
        failed: ['badge-danger', 'Gagal']
    };

    document.querySelectorAll('.tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
            tab.classList.add('active');
            activeTab = tab.getAttribute('data-tab');
            page = 1;
            // Filter status hanya relevan untuk pesanan nomor.
            document.getElementById('statusFilter').classList.toggle('hidden', activeTab !== 'orders');
            load();
        });
    });

    document.getElementById('statusFilter').addEventListener('change', function () { page = 1; load(); });
    document.getElementById('refreshBtn').addEventListener('click', load);
    document.getElementById('prevBtn').addEventListener('click', function () { if (page > 1) { page--; load(); } });
    document.getElementById('nextBtn').addEventListener('click', function () { page++; load(); });

    function emptyState(message) {
        return '<div class="card empty-state"><i class="ph ph-tray"></i><p class="small">' + esc(message) + '</p></div>';
    }

    async function load() {
        var container = document.getElementById('listContainer');
        container.innerHTML = '<div class="card center"><span class="spinner spinner-lg"></span></div>';

        try {
            if (activeTab === 'orders') await loadOrders(container);
            else await loadDeposits(container);
        } catch (error) {
            container.innerHTML = emptyState(error.message);
            document.getElementById('pager').classList.add('hidden');
        }
    }

    async function loadOrders(container) {
        var result = await App.api.get('/api/otp/history?page=' + page + '&limit=15');
        var statusFilter = document.getElementById('statusFilter').value;
        var orders = (result.data || []).filter(function (o) { return !statusFilter || o.status === statusFilter; });

        if (!orders.length) {
            container.innerHTML = emptyState('Belum ada pesanan pada halaman ini.');
        } else {
            container.innerHTML = orders.map(function (order) {
                var badge = ORDER_STATUS[order.status] || ['badge', order.status];
                return '<div class="history-item">' +
                    '<div class="history-icon">' +
                    (order.serviceImg ? '<img src="' + esc(order.serviceImg) + '" alt="">' : '<i class="ph-fill ph-device-mobile"></i>') +
                    '</div>' +
                    '<div style="flex:1;min-width:0">' +
                    '<div class="row-between" style="margin-bottom:3px">' +
                    '<strong class="small truncate">' + esc(order.service) + '</strong>' +
                    '<span class="badge ' + badge[0] + '">' + badge[1] + '</span>' +
                    '</div>' +
                    '<div class="tiny muted">' + esc(order.country) + ' &middot; ' + App.formatDate(order.createdAt, true) + '</div>' +
                    '<div class="mono small" style="margin-top:4px">' + esc(order.phoneNumber) + '</div>' +
                    (order.otpCode
                        ? '<div style="margin-top:7px"><span class="otp-pill" data-copy="' + esc(order.otpCode) + '">' +
                          'OTP ' + esc(order.otpCode) + ' <i class="ph ph-copy"></i></span></div>'
                        : '') +
                    '</div>' +
                    '<div class="small" style="text-align:right;white-space:nowrap"><strong>' + App.rupiah(order.price) + '</strong></div>' +
                    '</div>';
            }).join('');
            bindCopy();
        }

        updatePager(result.pagination);
    }

    async function loadDeposits(container) {
        var result = await App.api.get('/api/deposit/history?limit=50');
        var deposits = result.data || [];

        if (!deposits.length) {
            container.innerHTML = emptyState('Belum ada riwayat top up.');
        } else {
            container.innerHTML = deposits.map(function (deposit) {
                var badge = DEPOSIT_STATUS[deposit.status] || ['badge', deposit.status];
                var isDebit = deposit.amount < 0;
                return '<div class="history-item">' +
                    '<div class="history-icon" style="background:var(--info-soft);color:var(--info)">' +
                    '<i class="ph-fill ph-' + (isDebit ? 'arrow-circle-down' : 'arrow-circle-up') + '"></i></div>' +
                    '<div style="flex:1;min-width:0">' +
                    '<div class="row-between" style="margin-bottom:3px">' +
                    '<strong class="small truncate">' + esc(deposit.methodName || deposit.method) + '</strong>' +
                    '<span class="badge ' + badge[0] + '">' + badge[1] + '</span>' +
                    '</div>' +
                    '<div class="tiny muted">' + App.formatDate(deposit.createdAt, true) + '</div>' +
                    '<div class="tiny mono soft" style="margin-top:3px">' + esc(deposit.depositId) + '</div>' +
                    '</div>' +
                    '<div class="small" style="text-align:right;white-space:nowrap">' +
                    '<strong style="color:' + (isDebit ? 'var(--danger)' : 'var(--success)') + '">' +
                    (isDebit ? '-' : '+') + App.rupiah(Math.abs(deposit.amount)) + '</strong></div>' +
                    '</div>';
            }).join('');
        }

        document.getElementById('pager').classList.add('hidden');
    }

    function bindCopy() {
        document.querySelectorAll('[data-copy]').forEach(function (el) {
            el.addEventListener('click', function () { App.copyText(el.getAttribute('data-copy'), 'Kode OTP disalin.'); });
        });
    }

    function updatePager(pagination) {
        var pager = document.getElementById('pager');
        if (!pagination || pagination.totalPages <= 1) { pager.classList.add('hidden'); return; }
        pager.classList.remove('hidden');
        document.getElementById('pageInfo').textContent = 'Hal ' + pagination.page + ' / ' + pagination.totalPages;
        document.getElementById('prevBtn').disabled = pagination.page <= 1;
        document.getElementById('nextBtn').disabled = pagination.page >= pagination.totalPages;
    }

    load();
});
</script>
</body>
</html>
