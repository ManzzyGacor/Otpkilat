<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KilatOTP - Admin Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        .admin-card {
            background: linear-gradient(135deg, #000000 0%, #333333 100%);
            color: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body>

    <div class="container" id="adminContent" style="display: none; padding-bottom: 80px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Admin Control Panel</h2>
            <button class="btn" style="width: auto; padding: 8px 14px; background: transparent; border: 1px solid var(--glass-border); color: var(--text-color);" onclick="window.location.href='/profile'">
                Kembali
            </button>
        </div>

        <!-- Saldo Pusat RumahOTP -->
        <div class="admin-card">
            <h3 style="font-size: 14px; opacity: 0.8; margin-bottom: 4px;">Saldo Pusat (RumahOTP)</h3>
            <h1 id="centerBalance" style="font-size: 28px;">Memuat...</h1>
            <p id="centerUsername" style="font-size: 13px; opacity: 0.7; margin-top: 5px;">@admin</p>
        </div>

        <!-- Statistik Platform -->
        <div class="stats-grid">
            <div class="stat-box">
                <span style="font-size: 12px; opacity: 0.7;">Total Pengguna</span>
                <h3 id="statUsers" style="font-size: 20px; margin-top: 5px;">-</h3>
            </div>
            <div class="stat-box">
                <span style="font-size: 12px; opacity: 0.7;">Total Transaksi</span>
                <h3 id="statOrders" style="font-size: 20px; margin-top: 5px;">-</h3>
            </div>
        </div>

        <h3 style="margin-top: 25px; margin-bottom: 12px; font-size: 16px;">Konfigurasi Sistem</h3>
        <div class="liquid-glass" style="padding: 20px; margin-bottom: 20px;">
            <form id="settingsForm">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 13px; opacity: 0.8; display: block; margin-bottom: 6px;">Margin Profit Harga (%)</label>
                    <input type="number" id="marginProfit" placeholder="0" required style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color);">
                </div>
                <button type="submit" class="btn" style="background: var(--active-color); color: var(--active-text);">Simpan Pengaturan</button>
            </form>
        </div>

        <h3 style="margin-top: 25px; margin-bottom: 12px; font-size: 16px;">Manajemen Pengumuman</h3>
        <div class="liquid-glass" style="padding: 20px; margin-bottom: 20px;">
            <form id="addAnnouncementForm">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 13px; opacity: 0.8; display: block; margin-bottom: 6px;">Judul</label>
                    <input type="text" id="announceTitle" placeholder="Misal: Info Maintenance" required style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color);">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 13px; opacity: 0.8; display: block; margin-bottom: 6px;">Isi Pengumuman</label>
                    <textarea id="announceContent" rows="4" placeholder="Ketik pesan di sini..." required style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color); resize: vertical;"></textarea>
                </div>
                <button type="submit" class="btn" style="background: #007AFF;">Tambah Pengumuman</button>
            </form>
            
            <h4 style="margin-top: 20px; margin-bottom: 10px; font-size: 14px; opacity: 0.8;">Pengumuman Aktif</h4>
            <div id="announcementListAdmin" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="opacity: 0.6; font-size: 12px;">Memuat pengumuman...</p>
            </div>
        </div>

        <h3 style="margin-top: 25px; margin-bottom: 12px; font-size: 16px;">Manajemen Saldo User</h3>
        <div class="liquid-glass" style="padding: 20px;">
            <form id="balanceForm">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 13px; opacity: 0.8; display: block; margin-bottom: 6px;">Username Target</label>
                    <input type="text" id="targetUsername" placeholder="username" required style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color);">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 13px; opacity: 0.8; display: block; margin-bottom: 6px;">Nominal (Rp)</label>
                    <input type="number" id="targetAmount" placeholder="10000" required style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color);">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 13px; opacity: 0.8; display: block; margin-bottom: 6px;">Aksi Saldo</label>
                    <select id="targetType" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color);">
                        <option value="add" style="background: var(--bg-color);">Tambah Saldo</option>
                        <option value="reduce" style="background: var(--bg-color);">Kurangi Saldo</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="background: #34c759;">Eksekusi Saldo</button>
            </form>
        </div>

    </div>

    <!-- Floating Bottom Navbar -->
    <nav class="floating-nav liquid-glass">
        <a href="/" class="nav-item">
            <i class="ph ph-house"></i><span>Home</span>
        </a>
        <a href="/deposit" class="nav-item">
            <i class="ph ph-wallet"></i><span>Deposit</span>
        </a>
        <a href="/order" class="nav-item">
            <i class="ph ph-shopping-cart"></i><span>Order</span>
        </a>
        <a href="/riwayat" class="nav-item">
            <i class="ph ph-clock-counter-clockwise"></i><span>Riwayat</span>
        </a>
        <a href="/profile" class="nav-item">
            <i class="ph ph-user"></i><span>Profile</span>
        </a>
    </nav>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        const token = localStorage.getItem('token');
        if(!token) window.location.href = '/login';

        const headers = { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };

        async function loadAdminDashboard() {
            try {
                // 1. Cek Saldo Pusat RumahOTP
                const resBalance = await fetch('/api/user/admin/balance', { headers });
                const jsonBalance = await resBalance.json();
                
                if(resBalance.status === 403 || !jsonBalance.success) {
                    Toastify({ text: "Akses Ditolak! Anda bukan Admin.", style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
                    setTimeout(() => window.location.href = '/profile', 1500);
                    return;
                }

                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('centerBalance').innerText = jsonBalance.data.formated || 'Rp0';
                document.getElementById('centerUsername').innerText = `Akun Utama: @${jsonBalance.data.username || 'admin'}`;

                // 2. Ambil Statistik & Pengaturan Sistem
                const resStats = await fetch('/api/admin/stats', { headers });
                const jsonStats = await resStats.json();

                if (jsonStats.success) {
                    document.getElementById('statUsers').innerText = jsonStats.data.totalUsers;
                    document.getElementById('statOrders').innerText = jsonStats.data.totalOrders;
                    document.getElementById('marginProfit').value = jsonStats.data.setting.marginProfit;
                }
                
                // 3. Muat Daftar Pengumuman
                loadAnnouncements();

            } catch (err) {
                console.error(err);
                Toastify({ text: "Gagal memuat data Admin", style: { background: "#ff3b30", color: "#fff", borderRadius: "14px" } }).showToast();
            }
        }

        async function loadAnnouncements() {
            try {
                const res = await fetch('/api/announcements', { headers });
                const json = await res.json();
                const container = document.getElementById('announcementListAdmin');
                container.innerHTML = '';
                
                if(json.success && json.data && json.data.length > 0) {
                    json.data.forEach(item => {
                        container.innerHTML += `
                            <div style="background: rgba(0,0,0,0.1); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong style="font-size:14px; display: block; margin-bottom: 2px;">${item.title}</strong>
                                    <span style="font-size:11px; opacity:0.6;">${new Date(item.createdAt).toLocaleDateString('id-ID')}</span>
                                </div>
                                <button onclick="deleteAnnouncement('${item._id}')" style="background: #ff3b30; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer;">Hapus</button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="opacity: 0.6; font-size: 12px;">Belum ada pengumuman.</p>';
                }
            } catch (err) {
                console.error("Gagal memuat list pengumuman");
            }
        }

        // Simpan Setting Margin 
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const marginProfit = document.getElementById('marginProfit').value;
            // Kita tidak perlu mengirim announcementText lagi karena sudah dipisah
            try {
                const response = await fetch('/api/admin/settings', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ marginProfit, announcement: '' }) // announcement dikosongkan agar tidak error di controller lama
                });
                const data = await response.json();
                if (data.success) {
                    Toastify({ text: "Margin berhasil disimpan!", style: { background: "#34c759", color: "#fff", borderRadius: "14px" } }).showToast();
                } else {
                    Toastify({ text: data.message, style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
                }
            } catch (error) {
                Toastify({ text: "Terjadi kesalahan jaringan", style: { background: "#ff3b30", color: "#fff", borderRadius: "14px" } }).showToast();
            }
        });

        // Tambah Pengumuman Baru
        document.getElementById('addAnnouncementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('announceTitle').value;
            const content = document.getElementById('announceContent').value;
            
            try {
                const response = await fetch('/api/announcements/add', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ title, content })
                });
                const data = await response.json();
                if (data.success) {
                    Toastify({ text: "Pengumuman berhasil ditambahkan!", style: { background: "#34c759", color: "#fff", borderRadius: "14px" } }).showToast();
                    document.getElementById('addAnnouncementForm').reset();
                    loadAnnouncements(); // Refresh list
                } else {
                    Toastify({ text: data.message, style: { background: "#ff3b30", borderRadius: "14px" } }).showToast();
                }
            } catch (error) {
                Toastify({ text: "Gagal menambah pengumuman", style: { background: "#ff3b30", color: "#fff", borderRadius: "14px" } }).showToast();
            }
        });

        // Hapus Pengumuman
        async function deleteAnnouncement(id) {
            if(!confirm("Yakin ingin menghapus pengumuman ini?")) return;
            try {
                const response = await fetch(`/api/announcements/${id}`, {
                    method: 'DELETE',
                    headers: headers
                });
                const data = await response.json();
                if(data.success) {
                    Toastify({ text: "Pengumuman dihapus!", style: { background: "#34c759", color: "#fff", borderRadius: "14px" } }).showToast();
                    loadAnnouncements();
                }
            } catch (error) {
                Toastify({ text: "Gagal menghapus", style: { background: "#ff3b30", color: "#fff", borderRadius: "14px" } }).showToast();
            }
        }

        // Eksekusi Saldo User Manual
        document.getElementById('balanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('targetUsername').value;
            const amount = document.getElementById('targetAmount').value;
            const type = document.getElementById('targetType').value;

            try {
                const response = await fetch('/api/admin/adjust-balance', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ username, amount, type })
                });
                const data = await response.json();
                if (data.success) {
                    Toastify({ text: data.message, style: { background: "#34c759", color: "#fff", borderRadius: "14px" } }).showToast();
                    document.getElementById('targetUsername').value = '';
                    document.getElementById('targetAmount').value = '';
                } else {
                    Toastify({ text: data.message, style: { background: "#ff3b30", color: "#fff", borderRadius: "14px" } }).showToast();
                }
            } catch (error) {
                Toastify({ text: "Gagal mengubah saldo", style: { background: "#ff3b30", color: "#fff", borderRadius: "14px" } }).showToast();
            }
        });

        loadAdminDashboard();
    </script>
</body>
</html>
